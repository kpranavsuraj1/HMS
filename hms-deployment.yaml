apiVersion: apps/v1
kind: Deployment

metadata:
  name: hms-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hms

  template:
    metadata:
      labels:
        app: hms

    spec:
      containers:
        - name: hms
          image: hms-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"